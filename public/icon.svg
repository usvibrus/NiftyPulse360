<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">

  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
  </defs>

  <!-- Outer white rounded square (app icon style) -->
  <rect width="200" height="200" rx="40" fill="#FFFFFF"/>

  <!-- Blue inner square -->
  <rect x="16" y="16" width="168" height="168" rx="28" fill="url(#iconGrad)"/>

  <!-- Bar chart bars -->
  <rect x="38" y="124" width="22" height="38" rx="4" fill="rgba(255,255,255,0.30)"/>
  <rect x="68" y="108" width="22" height="54" rx="4" fill="rgba(255,255,255,0.50)"/>
  <rect x="98" y="88"  width="22" height="74" rx="4" fill="rgba(255,255,255,0.75)"/>

  <!-- Pulse / ECG line -->
  <polyline
    points="30,118 50,118 63,76 78,150 94,96 112,96 124,118 162,118"
    fill="none"
    stroke="#00E676"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Live dot at end of pulse -->
  <circle cx="162" cy="118" r="9" fill="#00E676"/>
  <circle cx="162" cy="118" r="4" fill="#FFFFFF"/>

</svg>
