<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120">

  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="520" height="120" rx="10" fill="#FFFFFF"/>

  <!-- Icon square -->
  <rect x="16" y="16" width="88" height="88" rx="10" fill="url(#iconGrad)"/>

  <!-- Bar chart bars -->
  <rect x="29" y="74" width="13" height="22" rx="2" fill="rgba(255,255,255,0.35)"/>
  <rect x="47" y="64" width="13" height="32" rx="2" fill="rgba(255,255,255,0.55)"/>
  <rect x="65" y="52" width="13" height="44" rx="2" fill="rgba(255,255,255,0.80)"/>

  <!-- Pulse / ECG line -->
  <polyline
    points="22,72 34,72 41,48 49,88 57,58 68,58 75,72 90,72"
    fill="none"
    stroke="#00E676"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Live dot -->
  <circle cx="90" cy="72" r="5" fill="#00E676"/>

  <!-- Wordmark: Nifty -->
  <text x="120" y="62"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
    fill="#0D1B2A"
    letter-spacing="-1">Nifty</text>

  <!-- Wordmark: Pulse -->
  <text x="238" y="62"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
    fill="#1565C0"
    letter-spacing="-1">Pulse</text>

  <!-- 360 -->
  <text x="120" y="90"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="700"
    fill="#1565C0"
    letter-spacing="6">360°</text>

  <!-- Tagline -->
  <text x="185" y="90"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="400"
    fill="#AAAAAA"
    letter-spacing="2">INDIA'S COMPLETE MARKET INTELLIGENCE</text>

</svg>
